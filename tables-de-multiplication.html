<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables × Maîtresse des Tables</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1828;
    --surface2: #252338;
    --accent: #ff6b6b;
    --accent2: #ffd166;
    --accent3: #06d6a0;
    --accent4: #a29bfe;
    --text: #fffffe;
    --text-muted: #8b8aaa;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(2px 2px at 35% 15%, rgba(162,155,254,0.5) 0%, transparent 100%),
      radial-gradient(2px 2px at 65% 85%, rgba(255,209,102,0.4) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    padding: 32px 0 40px;
  }

  .title-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent4), var(--accent));
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 800;
    line-height: 1.1;
  }

  h1 span {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .score-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 24px;
  }

  .score-item {
    text-align: center;
  }

  .score-num {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
  }

  .score-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }

  .score-item.correct .score-num { color: var(--accent3); }
  .score-item.wrong .score-num { color: var(--accent); }
  .score-item.streak .score-num { color: var(--accent2); }

  /* Mode selector */
  .mode-selector {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 6px;
    margin-bottom: 24px;
  }

  .mode-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--surface2);
    color: var(--text);
  }

  /* Table selector */
  .table-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }

  .table-btn {
    aspect-ratio: 1;
    border: 2px solid transparent;
    border-radius: 12px;
    background: var(--surface);
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .table-btn:hover {
    border-color: var(--accent4);
    color: var(--text);
  }

  .table-btn.selected {
    background: linear-gradient(135deg, var(--accent4) 0%, var(--accent) 100%);
    color: white;
    border-color: transparent;
    transform: scale(1.05);
  }

  .table-btn .mastery {
    position: absolute;
    bottom: 4px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 2px;
  }

  .mastery-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }

  .mastery-dot.filled {
    background: var(--accent2);
  }

  /* Quiz area */
  .quiz-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .quiz-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(162,155,254,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .question-text {
    font-family: 'Syne', sans-serif;
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 800;
    margin-bottom: 8px;
    transition: all 0.3s;
  }

  .question-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 32px;
  }

  /* Answer input */
  .answer-input {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
  }

  .answer-field {
    width: 120px;
    height: 64px;
    border: 2px solid var(--surface2);
    border-radius: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: all 0.2s;
  }

  .answer-field:focus {
    border-color: var(--accent4);
    box-shadow: 0 0 0 3px rgba(162,155,254,0.15);
  }

  .answer-field.correct {
    border-color: var(--accent3);
    background: rgba(6,214,160,0.1);
    color: var(--accent3);
  }

  .answer-field.wrong {
    border-color: var(--accent);
    background: rgba(255,107,107,0.1);
    color: var(--accent);
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .validate-btn {
    height: 64px;
    padding: 0 28px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent4), var(--accent));
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .validate-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(162,155,254,0.3);
  }

  .validate-btn:active { transform: translateY(0); }

  /* Feedback */
  .feedback {
    height: 32px;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .feedback.correct { color: var(--accent3); }
  .feedback.wrong { color: var(--accent); }

  /* MCQ mode */
  .mcq-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }

  .mcq-btn {
    padding: 20px;
    border: 2px solid var(--surface2);
    border-radius: 16px;
    background: var(--surface2);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mcq-btn:hover:not(:disabled) {
    border-color: var(--accent4);
    transform: translateY(-2px);
  }

  .mcq-btn.correct {
    border-color: var(--accent3);
    background: rgba(6,214,160,0.15);
    color: var(--accent3);
  }

  .mcq-btn.wrong {
    border-color: var(--accent);
    background: rgba(255,107,107,0.1);
    color: var(--accent);
    animation: shake 0.4s ease;
  }

  .mcq-btn:disabled { cursor: default; }

  /* Table view mode */
  .table-display {
    background: var(--surface);
    border-radius: 24px;
    padding: 32px;
    margin-bottom: 16px;
  }

  .table-display h2 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
    color: var(--accent4);
  }

  .table-rows {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .table-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface2);
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }

  .table-row .op { color: var(--text-muted); }
  .table-row .result { color: var(--accent2); margin-left: auto; font-size: 18px; }

  /* Progress section */
  .progress-section {
    background: var(--surface);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 16px;
  }

  .progress-section h3 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .progress-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .prog-item {
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    background: var(--surface2);
  }

  .prog-num {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
  }

  .prog-bar-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin: 4px 0;
    overflow: hidden;
  }

  .prog-bar {
    height: 100%;
    background: var(--accent3);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .prog-pct {
    font-size: 10px;
    color: var(--text-muted);
  }

  /* Celebration overlay */
  .celebration {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
  }

  .celebration-text {
    font-family: 'Syne', sans-serif;
    font-size: 72px;
    font-weight: 800;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .celebration-text.show {
    opacity: 1;
    transform: scale(1);
  }

  .celebration-text.hide {
    opacity: 0;
    transform: scale(1.3);
    transition: all 0.3s ease-in;
  }

  /* Timer bar */
  .timer-wrap {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
    display: none;
  }

  .timer-wrap.active { display: block; }

  .timer-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  /* Combo badge */
  .combo-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: rgba(255,209,102,0.15);
    border: 1px solid rgba(255,209,102,0.3);
    border-radius: 20px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 12px;
    transition: all 0.3s;
    opacity: 0;
  }

  .combo-badge.show { opacity: 1; }

  /* Nav tabs */
  .nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .nav-tab {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--surface);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .nav-tab.active {
    background: var(--accent4);
    color: white;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* Hint btn */
  .hint-btn {
    background: none;
    border: 1px solid var(--surface2);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .hint-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .hint-text {
    font-size: 13px;
    color: var(--accent2);
    margin-top: 8px;
    min-height: 20px;
  }

  @media (max-width: 480px) {
    .table-grid { grid-template-columns: repeat(5, 1fr); }
    .mcq-grid { grid-template-columns: 1fr 1fr; }
    .table-rows { grid-template-columns: 1fr; }
    .progress-grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="title-badge">✦ Entraînement ✦</div>
    <h1>Maîtresse<br>des <span>Tables</span> ×</h1>
    <div class="score-bar">
      <div class="score-item correct">
        <div class="score-num" id="score-correct">0</div>
        <div class="score-label">Bonnes</div>
      </div>
      <div class="score-item wrong">
        <div class="score-num" id="score-wrong">0</div>
        <div class="score-label">Erreurs</div>
      </div>
      <div class="score-item streak">
        <div class="score-num" id="score-streak">0</div>
        <div class="score-label">Série 🔥</div>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showSection('quiz')">🎯 Quiz</button>
    <button class="nav-tab" onclick="showSection('tables')">📋 Tables</button>
    <button class="nav-tab" onclick="showSection('progress')">📈 Progrès</button>
  </div>

  <!-- QUIZ SECTION -->
  <div class="section active" id="section-quiz">

    <!-- Table selector -->
    <div class="table-grid" id="table-selector"></div>

    <!-- Mode -->
    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('input')">✏️ Saisir</button>
      <button class="mode-btn" onclick="setMode('mcq')">🎯 QCM</button>
      <button class="mode-btn" onclick="setMode('timed')">⚡ Chrono</button>
    </div>

    <!-- Quiz card -->
    <div class="quiz-card">
      <div class="combo-badge" id="combo-badge">🔥 Combo x<span id="combo-num">0</span></div>
      <div class="timer-wrap" id="timer-wrap">
        <div class="timer-bar" id="timer-bar" style="width:100%"></div>
      </div>
      <div class="question-text" id="question-text">? × ? = ?</div>
      <div class="question-sub" id="question-sub">Choisis une table pour commencer</div>

      <!-- Saisie libre -->
      <div id="input-mode">
        <div class="answer-input">
          <input type="number" class="answer-field" id="answer-field" placeholder="?" min="0" max="200">
          <button class="validate-btn" onclick="checkAnswer()">→</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="hint-btn" onclick="showHint()">💡 Indice</button>
        <div class="hint-text" id="hint-text"></div>
      </div>

      <!-- QCM -->
      <div id="mcq-mode" style="display:none">
        <div class="mcq-grid" id="mcq-grid"></div>
        <div class="hint-text" id="hint-text-mcq"></div>
      </div>
    </div>

  </div>

  <!-- TABLES SECTION -->
  <div class="section" id="section-tables">
    <div class="table-display">
      <h2>Table de <span id="display-table-num">2</span></h2>
      <div class="table-rows" id="table-rows-display"></div>
    </div>
    <div style="display:flex; gap:8px; justify-content:center; margin-top:8px">
      <button class="validate-btn" style="height:44px;font-size:14px" onclick="prevTable()">← Précédente</button>
      <button class="validate-btn" style="height:44px;font-size:14px" onclick="nextTable()">Suivante →</button>
    </div>
  </div>

  <!-- PROGRESS SECTION -->
  <div class="section" id="section-progress">
    <div class="progress-section">
      <h3>Maîtrise par table</h3>
      <div class="progress-grid" id="progress-grid"></div>
    </div>
    <div class="progress-section">
      <h3>Statistiques</h3>
      <div id="stats-display"></div>
    </div>
    <button class="validate-btn" style="height:44px;font-size:14px;width:100%;margin-top:8px" onclick="resetProgress()">🗑️ Réinitialiser les progrès</button>
  </div>

</div>

<!-- Celebration overlay -->
<div class="celebration" id="celebration">
  <div class="celebration-text" id="celebration-text">🎉</div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
var state = {
  selectedTables: [2],
  mode: 'input',
  currentQ: null,
  score: { correct: 0, wrong: 0, streak: 0, bestStreak: 0 },
  progress: {},   // table -> { attempts, correct }
  timer: null,
  timerValue: 0,
  timerMax: 8000,
  canAnswer: true,
  displayTable: 2
};

// Load from localStorage
try {
  var saved = JSON.parse(localStorage.getItem('tables_progress') || '{}');
  if (saved.score) state.score = saved.score;
  if (saved.progress) state.progress = saved.progress;
} catch(e) {}

// Init progress for tables 2-9
for (var t = 2; t <= 9; t++) {
  if (!state.progress[t]) state.progress[t] = { attempts: 0, correct: 0 };
}

// ─── SAVE ────────────────────────────────────────────────────────────────────
function saveProgress() {
  try {
    localStorage.setItem('tables_progress', JSON.stringify({
      score: state.score,
      progress: state.progress
    }));
  } catch(e) {}
}

// ─── HINTS ───────────────────────────────────────────────────────────────────
var hints = {
  2: "Multiplier par 2, c'est doubler ! {a} + {a} = ?",
  3: "Table du 3 : compte de 3 en 3 depuis {a}×1",
  4: "×4 c'est doubler deux fois : {a}×2 = {a2}, puis {a2}×2",
  5: "×5 : regarde le résultat de ×10 et divise par 2 !",
  6: "{a}×6 = {a}×5 + {a} = {a5} + {a}",
  7: "{a}×7 = {a}×5 + {a}×2 = {a5} + {a2}",
  8: "×8 c'est doubler 3 fois : {a}×2×2×2",
  9: "Table du 9 : les chiffres des résultats font toujours 9 ! (18→1+8=9)"
};

function getHint(a, b) {
  var template = hints[b] || hints[a] || "Essaie de compter par {b} !";
  return template
    .replace(/{a}/g, a)
    .replace(/{b}/g, b)
    .replace(/{a2}/g, a*2)
    .replace(/{a5}/g, a*5);
}

// ─── TABLE SELECTOR ──────────────────────────────────────────────────────────
function buildTableSelector() {
  var el = document.getElementById('table-selector');
  el.innerHTML = '';
  for (var t = 2; t <= 9; t++) {
    (function(table) {
      var btn = document.createElement('button');
      btn.className = 'table-btn' + (state.selectedTables.indexOf(table) >= 0 ? ' selected' : '');
      
      var pct = 0;
      if (state.progress[table] && state.progress[table].attempts > 0) {
        pct = Math.round(state.progress[table].correct / state.progress[table].attempts * 100);
      }
      var dots = '';
      for (var d = 0; d < 5; d++) {
        dots += '<div class="mastery-dot' + (d < Math.floor(pct/20) ? ' filled' : '') + '"></div>';
      }
      
      btn.innerHTML = table + '<div class="mastery">' + dots + '</div>';
      btn.onclick = function() { toggleTable(table); };
      el.appendChild(btn);
    })(t);
  }
}

function toggleTable(t) {
  var idx = state.selectedTables.indexOf(t);
  if (idx >= 0) {
    if (state.selectedTables.length > 1) {
      state.selectedTables.splice(idx, 1);
    }
  } else {
    state.selectedTables.push(t);
  }
  buildTableSelector();
  generateQuestion();
}

// ─── QUESTION GENERATOR ──────────────────────────────────────────────────────
function generateQuestion() {
  clearTimer();
  state.canAnswer = true;
  document.getElementById('answer-field').value = '';
  document.getElementById('answer-field').className = 'answer-field';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('hint-text').innerHTML = '';

  var table = state.selectedTables[Math.floor(Math.random() * state.selectedTables.length)];
  var multiplier = Math.floor(Math.random() * 10) + 1;
  // Swap randomly for variety
  var a, b;
  if (Math.random() > 0.5) { a = table; b = multiplier; }
  else { a = multiplier; b = table; }

  state.currentQ = { a: a, b: b, answer: a * b };

  document.getElementById('question-text').innerHTML = a + ' <span style="color:var(--accent4)">×</span> ' + b + ' = <span style="color:var(--text-muted)">?</span>';
  document.getElementById('question-sub').textContent = 'Quelle est la réponse ?';

  if (state.mode === 'mcq') {
    buildMCQ();
  }

  if (state.mode === 'timed') {
    startTimer();
  }

  document.getElementById('answer-field').focus();
}

// ─── TIMER ───────────────────────────────────────────────────────────────────
function startTimer() {
  var wrap = document.getElementById('timer-wrap');
  wrap.classList.add('active');
  state.timerValue = state.timerMax;
  updateTimerBar();
  state.timer = setInterval(function() {
    state.timerValue -= 100;
    updateTimerBar();
    if (state.timerValue <= 0) {
      clearTimer();
      if (state.canAnswer) {
        handleWrong(true);
      }
    }
  }, 100);
}

function clearTimer() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  var wrap = document.getElementById('timer-wrap');
  wrap.classList.remove('active');
  document.getElementById('timer-bar').style.width = '100%';
}

function updateTimerBar() {
  var pct = (state.timerValue / state.timerMax) * 100;
  var bar = document.getElementById('timer-bar');
  bar.style.width = pct + '%';
  if (pct < 30) bar.style.background = 'linear-gradient(90deg, var(--accent), var(--accent2))';
  else bar.style.background = 'linear-gradient(90deg, var(--accent3), var(--accent2))';
}

// ─── MCQ ─────────────────────────────────────────────────────────────────────
function buildMCQ() {
  var correct = state.currentQ.answer;
  var options = [correct];
  var attempts = 0;
  while (options.length < 4 && attempts < 50) {
    attempts++;
    var delta = Math.floor(Math.random() * 6) - 3;
    if (delta === 0) delta = 1;
    var candidate = correct + delta * (Math.floor(Math.random() * 3) + 1);
    if (candidate > 0 && options.indexOf(candidate) < 0) {
      options.push(candidate);
    }
  }
  // Shuffle
  for (var i = options.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = options[i]; options[i] = options[j]; options[j] = tmp;
  }

  var grid = document.getElementById('mcq-grid');
  grid.innerHTML = '';
  document.getElementById('hint-text-mcq').innerHTML = '';
  options.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'mcq-btn';
    btn.textContent = opt;
    btn.onclick = function() { checkMCQ(opt, btn); };
    grid.appendChild(btn);
  });
}

function checkMCQ(val, btn) {
  if (!state.canAnswer) return;
  state.canAnswer = false;
  clearTimer();

  var allBtns = document.querySelectorAll('.mcq-btn');

  if (val === state.currentQ.answer) {
    btn.classList.add('correct');
    handleCorrect();
    setTimeout(function() { generateQuestion(); }, 1000);
  } else {
    btn.classList.add('wrong');
    handleWrong(false);
    // Show correct answer
    allBtns.forEach(function(b) {
      if (parseInt(b.textContent) === state.currentQ.answer) b.classList.add('correct');
      b.disabled = true;
    });
    document.getElementById('hint-text-mcq').innerHTML = '✓ La réponse était ' + state.currentQ.answer;
    setTimeout(function() { generateQuestion(); }, 1800);
  }
}

// ─── CHECK ANSWER ─────────────────────────────────────────────────────────────
function checkAnswer() {
  if (!state.canAnswer || !state.currentQ) return;
  var val = parseInt(document.getElementById('answer-field').value);
  if (isNaN(val)) return;

  clearTimer();
  state.canAnswer = false;

  if (val === state.currentQ.answer) {
    document.getElementById('answer-field').className = 'answer-field correct';
    document.getElementById('feedback').className = 'feedback correct';
    document.getElementById('feedback').innerHTML = getCorrectMsg();
    handleCorrect();
    setTimeout(function() { generateQuestion(); }, 900);
  } else {
    document.getElementById('answer-field').className = 'answer-field wrong';
    document.getElementById('feedback').className = 'feedback wrong';
    document.getElementById('feedback').innerHTML = '✗ &nbsp;La réponse était ' + state.currentQ.answer;
    handleWrong(false);
    setTimeout(function() { generateQuestion(); }, 1800);
  }
}

function getCorrectMsg() {
  var msgs = ['✓ Bravo !', '✓ Exact !', '✓ Parfait !', '✓ Super !', '✓ Bien joué !'];
  if (state.score.streak >= 5) msgs = ['🔥 En feu !', '⚡ Imbattable !', '💫 Incroyable !'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

// ─── HANDLE RESULTS ───────────────────────────────────────────────────────────
function handleCorrect() {
  state.score.correct++;
  state.score.streak++;
  if (state.score.streak > state.score.bestStreak) state.score.bestStreak = state.score.streak;

  var tbl = state.currentQ.b;
  if (state.progress[tbl]) { state.progress[tbl].attempts++; state.progress[tbl].correct++; }

  updateScoreDisplay();
  updateCombo();
  if (state.score.streak > 0 && state.score.streak % 5 === 0) celebrate();
  saveProgress();
  buildTableSelector();
}

function handleWrong(timeout) {
  state.score.wrong++;
  state.score.streak = 0;

  var tbl = state.currentQ.b;
  if (state.progress[tbl]) { state.progress[tbl].attempts++; }

  if (timeout) {
    document.getElementById('feedback').className = 'feedback wrong';
    document.getElementById('feedback').innerHTML = '⏱ Temps écoulé ! Réponse : ' + state.currentQ.answer;
    setTimeout(function() { generateQuestion(); }, 1800);
  }

  updateScoreDisplay();
  updateCombo();
  saveProgress();
  buildTableSelector();
}

// ─── UI UPDATES ───────────────────────────────────────────────────────────────
function updateScoreDisplay() {
  document.getElementById('score-correct').textContent = state.score.correct;
  document.getElementById('score-wrong').textContent = state.score.wrong;
  document.getElementById('score-streak').textContent = state.score.streak;
}

function updateCombo() {
  var badge = document.getElementById('combo-badge');
  var num = document.getElementById('combo-num');
  if (state.score.streak >= 3) {
    num.textContent = state.score.streak;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

// ─── HINT ─────────────────────────────────────────────────────────────────────
function showHint() {
  if (!state.currentQ) return;
  document.getElementById('hint-text').textContent = getHint(state.currentQ.a, state.currentQ.b);
}

// ─── CELEBRATE ───────────────────────────────────────────────────────────────
function celebrate() {
  var emojis = ['🎉', '⭐', '🌟', '🏆', '✨', '🎊', '💥'];
  var el = document.getElementById('celebration-text');
  el.textContent = emojis[Math.floor(Math.random() * emojis.length)] + ' ×' + state.score.streak + '!';
  el.className = 'celebration-text show';
  setTimeout(function() { el.className = 'celebration-text hide'; }, 1200);
  setTimeout(function() { el.className = 'celebration-text'; }, 1600);
}

// ─── MODE ─────────────────────────────────────────────────────────────────────
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(function(b, i) {
    b.className = 'mode-btn' + (['input','mcq','timed'][i] === mode ? ' active' : '');
  });
  document.getElementById('input-mode').style.display = (mode === 'mcq') ? 'none' : 'block';
  document.getElementById('mcq-mode').style.display = (mode === 'mcq') ? 'block' : 'none';
  generateQuestion();
}

// ─── SECTIONS ────────────────────────────────────────────────────────────────
function showSection(id) {
  document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('section-' + id).classList.add('active');
  var tabs = document.querySelectorAll('.nav-tab');
  var idx = ['quiz','tables','progress'].indexOf(id);
  if (tabs[idx]) tabs[idx].classList.add('active');

  if (id === 'tables') buildTableDisplay();
  if (id === 'progress') buildProgressDisplay();
}

// ─── TABLE DISPLAY ────────────────────────────────────────────────────────────
function buildTableDisplay() {
  var t = state.displayTable;
  document.getElementById('display-table-num').textContent = t;
  var rows = document.getElementById('table-rows-display');
  rows.innerHTML = '';
  for (var i = 1; i <= 10; i++) {
    var row = document.createElement('div');
    row.className = 'table-row';
    row.innerHTML = t + ' <span class="op">×</span> ' + i + ' <span class="op">=</span> <span class="result">' + (t*i) + '</span>';
    rows.appendChild(row);
  }
}

function prevTable() {
  state.displayTable = Math.max(2, state.displayTable - 1);
  buildTableDisplay();
}

function nextTable() {
  state.displayTable = Math.min(9, state.displayTable + 1);
  buildTableDisplay();
}

// ─── PROGRESS ────────────────────────────────────────────────────────────────
function buildProgressDisplay() {
  var grid = document.getElementById('progress-grid');
  grid.innerHTML = '';
  for (var t = 2; t <= 9; t++) {
    var p = state.progress[t] || { attempts: 0, correct: 0 };
    var pct = p.attempts > 0 ? Math.round(p.correct / p.attempts * 100) : 0;
    var item = document.createElement('div');
    item.className = 'prog-item';
    item.innerHTML = '<div class="prog-num" style="color:' + getPctColor(pct) + '">' + t + '</div>'
      + '<div class="prog-bar-wrap"><div class="prog-bar" style="width:' + pct + '%;background:' + getPctColor(pct) + '"></div></div>'
      + '<div class="prog-pct">' + pct + '%</div>';
    grid.appendChild(item);
  }

  var total = state.score.correct + state.score.wrong;
  var statsEl = document.getElementById('stats-display');
  statsEl.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px">'
    + statCard('Questions', total, 'var(--accent4)')
    + statCard('Réussite', total > 0 ? Math.round(state.score.correct/total*100)+'%' : '—', 'var(--accent3)')
    + statCard('Meilleure série', state.score.bestStreak + ' 🔥', 'var(--accent2)')
    + statCard('Tables travaillées', state.selectedTables.length, 'var(--accent)')
    + '</div>';
}

function statCard(label, val, color) {
  return '<div style="background:var(--surface2);padding:16px;border-radius:12px;text-align:center">'
    + '<div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;color:' + color + '">' + val + '</div>'
    + '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px">' + label + '</div>'
    + '</div>';
}

function getPctColor(pct) {
  if (pct >= 80) return 'var(--accent3)';
  if (pct >= 50) return 'var(--accent2)';
  return 'var(--accent)';
}

function resetProgress() {
  if (confirm('Effacer tous les progrès ?')) {
    for (var t = 2; t <= 9; t++) state.progress[t] = { attempts: 0, correct: 0 };
    state.score = { correct: 0, wrong: 0, streak: 0, bestStreak: 0 };
    updateScoreDisplay();
    saveProgress();
    buildProgressDisplay();
    buildTableSelector();
  }
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.getElementById('answer-field').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkAnswer();
});

// ─── INIT ────────────────────────────────────────────────────────────────────
buildTableSelector();
updateScoreDisplay();
generateQuestion();
updateCombo();
</script>
</body>
</html>
